     just the gateway URL, typed once. -->

     signed token when a shopper is logged in, and with nothing when they are not.
     CHAPMAN never receives a database credential. -->
<!--CHAPMAN_SESSION-->

<script src="AGENT_BASE/embed.js"
        data-site="pk_nilgiripost_dev"
        data-greeting="Ask me about our teas and coffees."

        defer></script>
